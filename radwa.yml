name: Two-Job Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test Job
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run tests
        run: |
          echo "Simulating code installation..."
          npm install --legacy-peer-deps || echo "No package.json found, skipping npm."
          echo "Running tests successfully!"

  deploy:
    name: Deployment Job
    needs: build-and-test # This ensures the second job runs ONLY after the first one succeeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate deployment
        run: |
          echo "First job completed successfully. Starting deployment..."
          echo "Deploying application to production server..."
          echo "Deployment complete!"
